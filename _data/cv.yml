  location: Bengaluru, India
  image: ""
  summary: |
    Broadly interested in in-situ and operando electron microscopy and advanced characterisation for probing structure–property relationships in functional materials. My work centres on correlated oxide systems, but I am motivated by any problem where nanoscale dynamics - phase transitions, domain evolution, defect-mediated phenomena - can be resolved through TEM, electron diffraction, and spectroscopy. I also integrate computational tools (image simulation, 4D-STEM analysis, spectral processing) with experimental microscopy to extract quantitative insights.

